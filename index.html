<!doctype html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intranet Pixel</title>
<link rel="icon" href="icon.png">
<script>
  /* Anti-destello del tema (design system §8). Por defecto: oscuro. */
  try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
  /* ===== Tokens: Pixel Graphic Design System v2 ===== */
  :root {
    --bg: #ffffff;  --surface: #f7f5f2;  --surface-hover: #f3f0ec;
    --fg: #223050;  --border: #e7e2dc;
    --muted: #6e6560;  --subtle: #8a8177;
    --chip: #f0ede8;  --icon-muted: #a39c95;
    --terracota: #D18259;
    --font-sans: "Inter", Arial, Helvetica, sans-serif;
    --font-mono: var(--font-sans);
  }
  .dark {
    --bg: #10161f;  --surface: #171f2b;  --surface-hover: #212b3a;
    --fg: #ede8e1;  --border: #2b3542;
    --muted: #b8b2a8;  --subtle: #8b8579;
    --chip: #1d2733;  --icon-muted: #5f6b78;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
    font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  main { flex: 1; }
  .container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  .eyebrow { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--subtle); margin: 0 0 4px; }
  svg { flex-shrink: 0; }

  /* ===== Hero ===== */
  .hero { position: relative; min-height: var(--hh, 400px); display: flex; flex-direction: column;
    background: var(--surface); border-bottom: 1px solid var(--border); background-size: cover; background-position: center; }
  .hero > .container { position: relative; z-index: 3; width: 100%; }
  .hero > .container.navwrap { z-index: 20; } /* el menú desplegable queda por encima del texto del banner */
  .hero .clip { position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .hero.foto .clip::before { content: ""; position: absolute; inset: 0; background: rgba(16,22,31,.55); }
  .hero.foto h1, .hero.foto .hero-text p, .hero.foto nav a.l, .hero.foto nav button.l { color: #fff; }
  .px { position: absolute; inset: 0;
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%); mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%); }
  .px-g { display: grid; width: 100%; height: 100%; grid-template-columns: repeat(46, 1fr); grid-template-rows: repeat(28, 1fr); }
  .pc { margin: 1px; border-radius: 2px; opacity: .08; animation: breathe var(--dur) ease-in-out var(--delay) infinite; }
  @keyframes breathe { 0%,100% { opacity: .08; } 50% { opacity: var(--max); } }
  @media (prefers-reduced-motion: reduce) { .pc { animation: none; opacity: calc(var(--max) * .6); } }

  nav { position: relative; display: flex; align-items: center; gap: 24px; padding: 20px 0; }
  nav .links { display: flex; gap: 6px; font-size: 13px; font-weight: 500; list-style: none; margin: 0; padding: 0; }
  nav .links > li { position: relative; }
  nav a.l, nav button.l { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none;
    font: inherit; font-weight: 500; background: none; border: 0; cursor: pointer; }
  nav a.l:hover, nav button.l:hover, nav li:focus-within > .l { color: var(--fg); background: var(--surface-hover); }
  nav .sub { display: none; position: absolute; top: 100%; left: 0; min-width: 200px; padding: 6px; margin: 0; list-style: none;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px; z-index: 10; }
  nav li:hover > .sub, nav li:focus-within > .sub, nav li.open > .sub { display: block; }
  nav .sub a.l { display: flex; width: 100%; }
  nav .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .iconbtn { display: grid; place-items: center; width: 34px; height: 34px; color: var(--muted); background: transparent;
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
  .iconbtn:hover { background: var(--surface-hover); color: var(--fg); }
  .theme .sun { display: none; } .dark .theme .sun { display: block; } .dark .theme .moon { display: none; }
  .menu-btn { display: none; }
  .logo { height: 23px; width: auto; display: block; }
  .logo-claro { display: none; } .dark .logo-claro { display: block; } .dark .logo-oscuro { display: none; }

  .hero-text { margin-top: auto; margin-bottom: auto; padding-top: 36px; padding-bottom: 72px; }
  .hero-text h1 { margin: 0 0 12px; font-size: clamp(32px, 5.5vw, 48px); font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
  .hero-text p { margin: 0; max-width: 460px; font-size: 14px; font-weight: 300; color: var(--muted); line-height: 1.6; }
  .hero-text p.eyebrow { font-size: 10px; font-weight: 400; color: var(--subtle); max-width: none; margin: 0 0 4px; }

  /* ===== Accesos rápidos ===== */
  .quick { position: relative; margin-top: -28px; z-index: 2; }
  .quick .bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; padding: 6px 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 999px; }
  .quick a { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; font-weight: 500;
    color: var(--fg); text-decoration: none; border-radius: 999px; }
  .quick a:hover { background: var(--surface-hover); }
  .quick svg { color: var(--terracota); }

  /* ===== Secciones ===== */
  section.blk { margin-top: 56px; }
  h2.t { margin: 0 0 18px; font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
  .two { display: grid; grid-template-columns: 1.7fr 1fr; gap: 40px; }
  .box { border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { font-family: var(--font-mono); font-size: 11px; padding: 4px 10px; color: var(--muted); background: transparent;
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
  .chip:hover { background: var(--surface-hover); }
  .chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  .news { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .nw { overflow: hidden; }
  /* La imagen de la noticia ya viene encuadrada (zoom y alto) desde el backoffice: se muestra completa, con su proporción. */
  .nw { align-self: start; }
  .nw .img { background: var(--chip); border-bottom: 1px solid var(--border); line-height: 0; }
  .nw .img img { display: block; width: 100%; height: auto; }
  .nw .img.empty { height: 150px; display: grid; place-items: center; }
  .nw .img img.ph { width: 46px; }
  .nw .b { padding: 16px 20px 20px; }
  .nw h3 { margin: 6px 0; font-size: 14px; font-weight: 500; line-height: 1.35; }
  .nw p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .nw .d { margin-top: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--subtle); }
  .empty { font-size: 13px; color: var(--subtle); padding: 12px 0; }

  /* ===== Calendario ===== */
  .cal { padding: 20px; }
  .cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; font-weight: 500; }
  #mes::first-letter { text-transform: uppercase; }
  .cal-h button { font: inherit; font-size: 18px; width: 30px; height: 30px; color: var(--muted); background: none; border: 0; border-radius: 8px; cursor: pointer; }
  .cal-h button:hover { background: var(--surface-hover); color: var(--fg); }
  .cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; }
  .cal-g .dn { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; color: var(--subtle); padding: 4px 0; }
  .cal-g .dy { padding: 8px 0; border-radius: 8px; position: relative; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cal-g .dy:hover { background: var(--surface-hover); }
  .cal-g .dy.today { background: var(--fg); color: var(--bg); font-weight: 500; }
  .cal-g .dy .emo { font-size: 16px; line-height: 1; }
  .cal-g .dy.has { cursor: pointer; padding: 5px 0; font: inherit; font-size: 12px; background: none; border: 0; color: var(--fg); }
  .cal-g .dy.has:hover, .cal-g .dy.has:focus-visible { background: var(--surface-hover); outline: none; }
  .cal-g .dy.has.today { background: var(--fg); color: var(--bg); }
  .cal-g .dy .mk { display: flex; justify-content: center; gap: 2px; height: 12px; color: var(--terracota); margin-top: 1px; }
  .cal-g .dy.today .mk { color: var(--bg); }
  #tip { position: fixed; z-index: 50; max-width: 240px; padding: 8px 10px; font-size: 12px; line-height: 1.4; color: var(--fg);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; pointer-events: none; }
  #tip .tl { display: flex; align-items: center; gap: 6px; } #tip .tl + .tl { margin-top: 4px; } #tip svg { color: var(--terracota); }
  .ev { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; color: var(--muted); line-height: 1.4; }
  .ev svg { color: var(--terracota); margin-top: 1px; } .ev b { color: var(--fg); font-weight: 500; } .ev .dd { font-family: var(--font-mono); color: var(--subtle); min-width: 38px; }
  .evs { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; display: grid; gap: 8px; }
  .ev-none { font-size: 12px; color: var(--subtle); text-align: center; padding: 4px 0; }

  /* ===== Herramientas ===== */
  .tools-h { text-align: center; }
  .tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 0 0 18px; }
  #q { display: block; width: 100%; max-width: 420px; margin: 0 auto 22px; padding: 8px 12px; font: inherit; font-size: 13px; color: var(--fg);
    background: var(--surface-hover); border: 1px solid var(--border); border-radius: 8px; }
  #q::placeholder { color: var(--subtle); }
  #q:focus { outline: 1px solid var(--fg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  a.card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 500; line-height: 1.3; }
  a.card:hover, a.card:focus-visible { background: var(--surface-hover); outline: none; border-color: var(--icon-muted); }
  .ico { flex-shrink: 0; width: 36px; height: 36px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border);
    color: var(--terracota); display: grid; place-items: center; }
  .hidden { display: none !important; }
  #vacio { text-align: center; color: var(--subtle); font-size: 13px; }

  /* ===== Pata ===== */
  footer { padding: 64px 0 32px; text-align: center; }
  footer img { height: 22px; width: auto; max-width: 80%; }
  html:not(.dark) footer img { filter: brightness(0); opacity: .8; }
  #aviso { margin-top: 14px; font-size: 11px; color: var(--subtle); }

  @media (max-width: 820px) {
    .two { grid-template-columns: 1fr; gap: 48px; }
    .menu-btn { display: grid; }
    nav .links { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; gap: 0; padding: 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px; z-index: 10; }
    body.menu-open nav .links { display: flex; }
    nav .sub { display: block; position: static; border: 0; padding: 0 0 0 14px; min-width: 0; }
    nav button.l .chev { display: none; }
    nav a.l, nav button.l { width: 100%; padding: 10px; }
    .quick .bar { border-radius: 12px; justify-content: flex-start; }
  }
  @media (max-width: 560px) {
    .container { padding: 0 16px; }
    /* Accesos rápidos y herramientas en 2 columnas: menos desplazamiento en el celular */
    .quick .bar { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 6px; border-radius: 16px; }
    .quick a { padding: 10px 8px; gap: 8px; font-size: 12.5px; line-height: 1.25; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    a.card { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; font-size: 13px; }
    .tabs { justify-content: flex-start; }
    section.blk { margin-top: 44px; }
    footer { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
    .logo { height: 18px; }
    .hero { min-height: min(var(--hh, 340px), 360px); }
  }
</style>
</head>
<body>
<main>
  <div class="hero" id="hero">
    <div class="clip"><div class="px" id="px" aria-hidden="true"><div class="px-g" id="pxg"></div></div></div>
    <div class="container navwrap">
      <nav>
        <img class="logo logo-claro" src="logo-claro.png" alt="Pixel Graphic">
        <img class="logo logo-oscuro" src="logo-oscuro.png" alt="Pixel Graphic">
        <ul class="links" id="topnav"></ul>
        <div class="right">
          <button class="iconbtn theme" id="theme" aria-label="Cambiar tema"></button>
          <button class="iconbtn menu-btn" id="menubtn" aria-label="Abrir menú" aria-expanded="false"></button>
        </div>
      </nav>
    </div>
    <div class="container hero-text">
      <p class="eyebrow" id="b-eyebrow"></p>
      <h1 id="b-title"></h1>
      <p id="b-text"></p>
    </div>
  </div>

  <div class="container quick"><div class="bar" id="quick"></div></div>

  <section class="blk container" id="noticias">
    <div class="two">
      <div>
        <p class="eyebrow">Compañía</p>
        <h2 class="t">Noticias y actualizaciones</h2>
        <div class="news" id="news"></div>
      </div>
      <div id="calendario">
        <p class="eyebrow">Agenda</p>
        <h2 class="t">Calendario</h2>
        <div class="box cal">
          <div class="cal-h"><button id="prev" aria-label="Mes anterior">‹</button><span id="mes"></span><button id="next" aria-label="Mes siguiente">›</button></div>
          <div class="cal-g" id="calg"></div>
          <div class="evs" id="evs"></div>
          <div id="tip" class="hidden" role="tooltip"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="blk container" id="herramientas">
    <div class="tools-h"><p class="eyebrow">Accesos</p><h2 class="t">Nuestras herramientas</h2></div>
    <div class="tabs chips" id="tabs"></div>
    <input id="q" type="search" placeholder="Buscar herramienta…" autocomplete="off">
    <div class="grid" id="tools"></div>
    <p id="vacio" class="hidden">No hay herramientas que coincidan.</p>
  </section>
</main>

<footer><img src="pata.png" alt="Pixel Graphic — El único ecosistema integral de la región, experto en catálogos"><div id="aviso"></div></footer>

<script src="assets/config.js"></script>
<script src="assets/common.js?v=2"></script>
<script src="assets/supabase-js-2.117.3.min.js"></script>
<script src="assets/respaldo.js"></script>
<script>var st = document.createElement('style'); st.textContent = PX.richCss(); document.head.appendChild(st);</script>
<script>
(function () {
  var h = PX.h, CFG = window.PX_CONFIG, $ = function (id) { return document.getElementById(id); };
  var norm = function (s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };

  /* ---------- Tema ---------- */
  $('theme').append(PX.svgIcon('sun'), PX.svgIcon('moon'));
  $('theme').firstChild.setAttribute('class', 'sun'); $('theme').lastChild.setAttribute('class', 'moon');
  $('theme').onclick = function () {
    var d = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('theme', d ? 'dark' : 'light'); } catch (e) {}
  };
  $('menubtn').append(PX.svgIcon('menu'));
  $('topnav').addEventListener('click', function (e) { if (e.target.closest('a')) { document.body.classList.remove('menu-open'); $('menubtn').setAttribute('aria-expanded', 'false'); } });
  $('menubtn').onclick = function () { var o = document.body.classList.toggle('menu-open'); $('menubtn').setAttribute('aria-expanded', o); };

  /* ---------- Fondo de píxeles (réplica de PixelBackground) ---------- */
  (function () {
    var COL = ['#223050', '#D18259', '#9B6B4F', '#E2B584'], t = 42, out = document.createDocumentFragment();
    var rnd = function () { t |= 0; t = (t + 0x6d2b79f5) | 0; var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
    for (var i = 0; i < 46 * 28; i++) {
      var c = document.createElement('div'); c.className = 'pc';
      c.style.background = COL[i % 4];
      c.style.setProperty('--dur', (2.5 + rnd() * 3.5).toFixed(2) + 's');
      c.style.setProperty('--delay', (-rnd() * 6).toFixed(2) + 's');
      c.style.setProperty('--max', (0.22 + rnd() * 0.4).toFixed(3));
      out.appendChild(c);
    }
    $('pxg').appendChild(out);
  })();

  /* ---------- Carga de contenido: Supabase con timeout y respaldo ---------- */
  function withTimeout(ms) {
    return function (url, opts) {
      var ac = new AbortController(), id = setTimeout(function () { ac.abort(); }, ms);
      return fetch(url, Object.assign({}, opts, { signal: ac.signal })).finally(function () { clearTimeout(id); });
    };
  }
  async function loadLive() {
    if (!CFG || !CFG.url || !CFG.anonKey || !window.supabase) throw new Error('sin configuración');
    var sb = supabase.createClient(CFG.url, CFG.anonKey, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      global: { fetch: withTimeout(4000) }
    });
    var r = await Promise.all([
      sb.from('site_settings').select('key,value'),
      sb.from('menu_items').select('id,parent_id,zone,label,kind,target,tool_id,icon,position').order('position'),
      sb.from('tool_categories').select('id,label,position').order('position'),
      sb.from('tools').select('id,category_id,name,icon,url,position').order('position'),
      sb.from('news').select('id,title,body,category,image_path,published_on,featured_order').not('featured_order', 'is', null).order('featured_order'),
      sb.from('events').select('id,title,type,person_name,event_month,event_day,event_date,event_time,description,emoji')
    ]);
    for (var i = 0; i < r.length; i++) if (r[i].error) throw r[i].error;
    var settings = {}; r[0].data.forEach(function (x) { settings[x.key] = x.value; });
    if (!r[0].data.length || !r[2].data.length || !r[3].data.length) throw new Error('respuesta vacía en secciones obligatorias');
    return { settings: settings, menu: r[1].data, categories: r[2].data, tools: r[3].data, news: r[4].data, events: r[5].data };
  }

  /* ---------- Render (todo con createElement/textContent) ---------- */
  function renderBanner(c) {
    var s = c.settings;
    $('b-eyebrow').textContent = ''; $('b-eyebrow').appendChild(PX.rich(s.banner_eyebrow));
    $('b-title').textContent = ''; $('b-title').appendChild(PX.rich(s.banner_title));
    $('b-text').textContent = ''; $('b-text').appendChild(PX.rich(s.banner_text));
    var url = PX.mediaUrl(CFG, s.banner_image), hero = $('hero'), bh = parseInt(s.banner_height, 10);
    if (bh >= 200 && bh <= 600) hero.style.setProperty('--hh', bh + 'px');
    if (url) {
      var im = new Image();
      im.onload = function () { hero.style.backgroundImage = 'url("' + url + '")'; hero.classList.add('foto'); $('px').remove(); };
      im.src = url;
    }
  }

  function menuLink(item, tools, cls) {
    var label = item.label, a;
    if (item.kind === 'anchor' && PX.ANCHORS.indexOf(item.target) > -1) {
      a = h('a', { class: cls, href: item.target }, label);
    } else if (item.kind === 'url') {
      var u = PX.safeUrl(item.target); if (!u) return null;
      a = h('a', { class: cls, href: u, target: u.indexOf('mailto:') === 0 ? null : '_blank', rel: 'noopener noreferrer' }, label);
    } else if (item.kind === 'tool') {
      var t = tools.filter(function (x) { return x.id === item.tool_id; })[0]; if (!t) return null;
      var tu = PX.safeUrl(t.url); if (!tu) return null;
      a = h('a', { class: cls, href: tu, target: '_blank', rel: 'noopener noreferrer' }, PX.svgIcon(item.icon || t.icon, 18), item.label || t.name);
      return a;
    } else return null;
    return a;
  }

  function renderMenus(c) {
    var byPos = function (a, b) { return a.position - b.position; };
    var top = c.menu.filter(function (m) { return m.zone === 'top' && !m.parent_id; }).sort(byPos);
    var nav = $('topnav'); nav.textContent = '';
    top.forEach(function (m) {
      var kids = c.menu.filter(function (k) { return k.parent_id === m.id; }).sort(byPos);
      var li = h('li');
      if (kids.length) {
        var btn = h('button', { class: 'l', type: 'button', 'aria-haspopup': 'true' }, m.label, (function () { var s = PX.svgIcon('chevron', 14); s.setAttribute('class', 'chev'); return s; })());
        btn.onclick = function (e) { e.stopPropagation(); li.classList.toggle('open'); };
        var ul = h('ul', { class: 'sub' });
        kids.forEach(function (k) { var a = menuLink(k, c.tools, 'l'); if (a) ul.appendChild(h('li', null, a)); });
        li.append(btn, ul);
      } else {
        var a = menuLink(m, c.tools, 'l'); if (!a) return; li.appendChild(a);
      }
      nav.appendChild(li);
    });
    document.addEventListener('click', function () { document.querySelectorAll('nav li.open').forEach(function (x) { x.classList.remove('open'); }); });

    var q = $('quick'); q.textContent = '';
    c.menu.filter(function (m) { return m.zone === 'quick'; }).sort(byPos).forEach(function (m) {
      var a = menuLink(m, c.tools, ''); if (!a) return;
      if (m.kind !== 'tool') a.insertBefore(PX.svgIcon(m.icon || 'link', 18), a.firstChild);
      q.appendChild(a);
    });
  }

  function fmtDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' }); }
  function renderNews(c) {
    var box = $('news'); box.textContent = '';
    if (!c.news.length) { box.appendChild(h('p', { class: 'empty' }, 'Aún no hay noticias destacadas.')); return; }
    c.news.slice(0, 2).forEach(function (n) {
      var img = PX.mediaUrl(CFG, n.image_path);
      box.appendChild(h('article', { class: 'box nw' },
        h('div', { class: 'img' + (img ? '' : ' empty') }, img ? h('img', { src: img, alt: '' }) : h('img', { class: 'ph', src: 'icon.png', alt: '' })),
        h('div', { class: 'b' }, h('p', { class: 'eyebrow' }, n.category), h('h3', null, PX.rich(n.title)), h('p', null, PX.rich(n.body)), h('div', { class: 'd' }, fmtDate(n.published_on)))));
    });
  }

  /* Calendario: cumpleaños (se repiten cada año por mes/día) y eventos con fecha */
  var EMO_DEF = { cumple: '🎂', reunion: '🤝', capacitacion: '🎓', otro: '⭐' };
  function emo(e) { return e.emoji || EMO_DEF[e.type] || '⭐'; }
  var ref = new Date(); ref.setDate(1);
  var todayBogota = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }).split('-').map(Number);
  var events = [];
  function eventsOf(y, m, d) { // m: 1-12
    var leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0, out = [];
    events.forEach(function (e) {
      if (e.type === 'cumple') {
        var day = e.event_day, mon = e.event_month;
        if (mon === 2 && day === 29 && !leap) day = 28; // los del 29 de febrero se celebran el 28 en años no bisiestos
        if (mon === m && day === d) out.push(e);
      } else if (e.event_date) {
        var p = e.event_date.split('-').map(Number);
        if (p[0] === y && p[1] === m && p[2] === d) out.push(e);
      }
    });
    return out;
  }
  function evLabel(e) { return e.type === 'cumple' ? 'Cumpleaños de ' + e.person_name : e.title + (e.event_time ? ' · ' + e.event_time.slice(0, 5) : ''); }
  var tip = null;
  function showTip(el, list) {
    var t = $('tip'); t.textContent = '';
    list.forEach(function (e) { t.appendChild(h('div', { class: 'tl' }, h('span', null, emo(e)), evLabel(e))); });
    t.classList.remove('hidden'); tip = el;
    var r = el.getBoundingClientRect(), w = t.offsetWidth, x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
    t.style.left = x + 'px'; t.style.top = (r.bottom + 6) + 'px';
  }
  function hideTip() { $('tip').classList.add('hidden'); tip = null; }
  document.addEventListener('click', function (e) { if (tip && !tip.contains(e.target)) hideTip(); });
  function renderCal() {
    hideTip();
    var y = ref.getFullYear(), m = ref.getMonth();
    $('mes').textContent = ref.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
    var first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate(), g = $('calg'); g.textContent = '';
    ['L', 'M', 'M', 'J', 'V', 'S', 'D'].forEach(function (d) { g.appendChild(h('div', { class: 'dn' }, d)); });
    for (var i = 0; i < first; i++) g.appendChild(h('div'));
    var monthList = [];
    for (var d = 1; d <= days; d++) {
      var isToday = d === todayBogota[2] && m + 1 === todayBogota[1] && y === todayBogota[0], list = eventsOf(y, m + 1, d), cls = 'dy' + (isToday ? ' today' : '');
      if (!list.length) { g.appendChild(h('div', { class: cls }, d)); continue; }
      // El emoji del evento reemplaza al número del día (con varios eventos, se muestra el primero).
      var btn = h('button', { class: cls + ' has', type: 'button', 'aria-label': d + ': ' + list.map(evLabel).join(', ') }, h('span', { class: 'emo', 'aria-hidden': 'true' }, emo(list[0])));
      (function (b, l) {
        b.addEventListener('mouseenter', function () { showTip(b, l); }); b.addEventListener('mouseleave', hideTip);
        b.addEventListener('focus', function () { showTip(b, l); }); b.addEventListener('blur', hideTip);
        b.addEventListener('click', function (ev) { ev.stopPropagation(); showTip(b, l); });
      })(btn, list);
      g.appendChild(btn);
      list.forEach(function (e) { monthList.push({ d: d, e: e }); });
    }
    var box = $('evs'); box.textContent = '';
    if (!monthList.length) { box.appendChild(h('div', { class: 'ev-none' }, 'Sin eventos este mes')); return; }
    monthList.forEach(function (x) {
      box.appendChild(h('div', { class: 'ev' }, h('span', { class: 'dd' }, String(x.d).padStart(2, '0') + '/' + String(m + 1).padStart(2, '0')),
        h('span', null, emo(x.e)), h('span', null, h('b', null, evLabel(x.e)), x.e.description ? h('span', null, ' — ' + x.e.description) : null)));
    });
  }
  $('prev').onclick = function () { ref.setMonth(ref.getMonth() - 1); renderCal(); };
  $('next').onclick = function () { ref.setMonth(ref.getMonth() + 1); renderCal(); };

  function renderTools(c) {
    var cats = c.categories.slice().sort(function (a, b) { return a.position - b.position; });
    var grid = $('tools'), tabs = $('tabs'), qi = $('q'), cur = 'todas', cards = [];
    grid.textContent = ''; tabs.textContent = '';
    var order = {}; cats.forEach(function (k, i) { order[k.id] = i; });
    c.tools.slice().sort(function (a, b) { return (order[a.category_id] - order[b.category_id]) || (a.position - b.position); }).forEach(function (t) {
      var u = PX.safeUrl(t.url); if (!u) return;
      var a = h('a', { class: 'card', href: u, target: '_blank', rel: 'noopener noreferrer', 'data-cat': t.category_id },
        h('span', { class: 'ico' }, PX.svgIcon(t.icon, 18)), t.name);
      cards.push(a); grid.appendChild(a);
    });
    function filtra() {
      var t = norm(qi.value.trim());
      cards.forEach(function (a) { a.classList.toggle('hidden', !((cur === 'todas' || a.getAttribute('data-cat') === cur) && (!t || norm(a.textContent).indexOf(t) > -1))); });
      $('vacio').classList.toggle('hidden', cards.some(function (a) { return !a.classList.contains('hidden'); }));
    }
    [{ id: 'todas', label: 'Todas' }].concat(cats).forEach(function (k, i) {
      var b = h('button', { class: 'chip' + (i === 0 ? ' on' : ''), type: 'button' }, k.label);
      b.onclick = function () { cur = k.id; tabs.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === b); }); filtra(); };
      tabs.appendChild(b);
    });
    qi.oninput = filtra;
  }

  function renderAll(c, fromBackup) {
    events = c.events || []; renderBanner(c); renderMenus(c); renderNews(c); renderCal(); renderTools(c);
    $('aviso').textContent = fromBackup ? 'Mostrando contenido guardado (sin conexión con el servidor).' : '';
  }

  var cacheBackup = window.PX_RESPALDO;
  var cap = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('tiempo agotado (4 s)')); }, 4000); });
  Promise.race([loadLive(), cap]).then(function (c) { renderAll(c, false); }).catch(function (e) {
    if (window.console) console.warn('Intranet: usando respaldo —', e && e.message ? e.message : e);
    renderAll(cacheBackup, true);
  });
})();
</script>
</body>
</html>
